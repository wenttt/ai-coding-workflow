[project]
name = "ai-coding-workflow"
version = "0.1.0"
description = "MCP server for AI Coding Agent team collaboration workflow (Jira → design → implement → review → test → deploy)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Taven" },
]
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.4.0",
    "atlassian-python-api>=3.41.0",
    "PyGithub>=2.1.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "python-frontmatter>=1.1.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
ai-coding-workflow = "ai_coding_workflow.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_coding_workflow"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_coding_workflow/resources" = "ai_coding_workflow/resources"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --cov=ai_coding_workflow --cov-report=term-missing"
